apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost
  namespace: ${NAMESPACE}
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - ${LLM_GATEWAY_DOMAIN}
      secretName: AppFactory-tls
  rules:
    - host: ${LLM_GATEWAY_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bifrost
                port:
                  number: 8080
