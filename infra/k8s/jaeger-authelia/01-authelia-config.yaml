apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: ${NAMESPACE}
data:
  configuration.yml: |
    theme: dark
    log:
      level: info

    server:
      address: 'tcp://0.0.0.0:9091/authelia'
      disable_healthcheck: false

    identity_validation:
      reset_password:
        jwt_secret: "${AUTHELIA_JWT_SECRET}"

    authentication_backend:
      file:
        path: /config/users_database.yml

    session:
      secret: "${AUTHELIA_SESSION_SECRET}"
      cookies:
        - name: authelia_session
          domain: "${JAEGER_DOMAIN}"
          same_site: lax
          authelia_url: "https://${JAEGER_DOMAIN}/authelia/"
          default_redirection_url: "https://${JAEGER_DOMAIN}/"
          expiration: 1h
          inactivity: 5m
      redis:
        host: redis
        port: 6379

    access_control:
      default_policy: deny
      rules:
        - domain: "${JAEGER_DOMAIN}"
          policy: one_factor

    regulation:
      max_retries: 5
      find_time: 10m
      ban_time: 15m

    storage:
      encryption_key: "${AUTHELIA_STORAGE_ENCRYPTION_KEY}"
      local:
        path: /config/db.sqlite3

    notifier:
      filesystem:
        filename: /config/notification.txt
